services:
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping", "|", "grep", "PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main-network

  backend:
    build:
      context: ./backend
    container_name: backend
    volumes:
      - ./blacklist.txt:/app/blacklist.txt:ro
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - main-network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    depends_on:
      - backend
    networks:
      - main-network

  nginx:
    image: nginx:alpine
    container_name: temp-nginx
    # ПОРТЫ УДАЛЕНЫ
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - main-network

volumes:
  redis_data:

networks:
  main-network:
    external: true
